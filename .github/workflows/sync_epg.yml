name: Sync M3U and EPG

on:
  schedule:
    # Runs every 4 hours at minute 0
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Processing Script
        env:
          M3U_URL: ${{ secrets.M3U_URL }}
          SOURCE_EPG_URL: ${{ secrets.SOURCE_EPG_URL }}
          EPG_GURU_URLS: ${{ secrets.EPG_GURU_URLS }}
        run: python scripts/process_epg.py

      - name: Commit and Push Files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/
          git commit -m "Automated update of M3U and EPG" || exit 0
          git push
